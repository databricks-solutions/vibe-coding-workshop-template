# =============================================================================
# Semantic Layer Manifest
# =============================================================================
# Generated by: planning/00-project-planning (stage 5)
# Consumed by:  semantic-layer/00-semantic-layer-setup (stage 6)
#
# This manifest defines all Metric Views, TVFs, and Genie Spaces that the
# Semantic Layer orchestrator should create. It is generated from the plan
# addendums (phase1-addendum-1.2-tvfs.md, phase1-addendum-1.3-metric-views.md,
# phase1-addendum-1.6-genie-spaces.md) and the Gold layer YAML schemas.
#
# Usage:
#   1. Fill in the template below during Planning (stage 5)
#   2. Save as: plans/manifests/semantic-layer-manifest.yaml
#   3. The semantic-layer orchestrator reads this at Phase 0
#   4. This manifest is REQUIRED — the orchestrator will STOP if it is missing
# =============================================================================

version: 2
manifest_type: semantic-layer
planning_mode: acceleration  # or "workshop" — downstream orchestrators must not expand beyond listed artifacts

# -----------------------------------------------------------------------------
# Layer-aware planning source (set by Phase 0 of the planning orchestrator)
# -----------------------------------------------------------------------------
# - Acceleration always sets selected_layer = deployed_gold (or gold_design if
#   explicitly accepted).
# - Workshop may set selected_layer to deployed_gold, gold_design,
#   deployed_silver, deployed_bronze, or source_csv based on what is available.
# - Downstream consumers MUST honor implementation_readiness:
#     gold_ready / gold_design_only / workshop_deployable -> deploy against
#     the schema declared by planning_source (gold_schema / silver_schema /
#     bronze_schema). workshop_draft (only when selected_layer = source_csv)
#     stops before deployment because no live tables exist.
# - requires_gold_promotion is ADVISORY only; it never gates deployment.
# -----------------------------------------------------------------------------
planning_source:
  selected_layer: deployed_gold      # deployed_gold | gold_design | deployed_silver | deployed_bronze | source_csv
  schema: "${catalog}.${gold_schema}"   # null when selected_layer = source_csv
  source_yaml_dir: "gold_layer_design/yaml"      # only when selected_layer = gold_design
  source_csv_paths: []                            # populated for source_csv only
  selected_at: "<ISO-8601 UTC>"
implementation_readiness: gold_ready              # gold_ready | gold_design_only | workshop_deployable | workshop_draft
requires_gold_promotion: false                    # advisory only; recommended for production hardening

generated_from:
  gold_yaml_dir: gold_layer_design/yaml/   # populated when selected_layer is gold-based
  source_inventory:                         # populated for non-Gold workshop sources
    schema: ""                              # e.g. "${catalog}.${silver_schema}"
    tables: []                              # e.g. ["silver_bookings", "silver_properties"]
  plan_addendums:
    - plans/phase1-addendum-1.2-tvfs.md
    - plans/phase1-addendum-1.3-metric-views.md
    - plans/phase1-addendum-1.6-genie-spaces.md

# -----------------------------------------------------------------------------
# Global settings
# -----------------------------------------------------------------------------
catalog: ${catalog}
gold_schema: ${gold_schema}
semantic_schema: ${semantic_schema}    # Schema for metric views and TVFs (production deploy target)
# Optional layer-aware fields (used in workshop mode when planning_source != gold):
silver_schema: ""                       # e.g. ${silver_schema}
bronze_schema: ""                       # e.g. ${bronze_schema}
source_schema: ""                       # alias for whichever layer is selected; defaults to gold_schema

# -----------------------------------------------------------------------------
# Domains — one entry per agent domain
# Repeat this block for each domain defined in the project plan
# -----------------------------------------------------------------------------
domains:
  # ---------------------------------------------------------------------------
  # Example domain (replace with your actual domain)
  # ---------------------------------------------------------------------------
  {domain_name}:
    description: "{Brief description of domain focus area}"
    # gold_tables is the canonical list when planning_source = deployed_gold | gold_design.
    # In workshop_deployable manifests (Silver/Bronze) it is the *target* Gold list
    # recommended for production promotion; source_assets reflects the actual
    # planning-source layer (Silver/Bronze) used for workshop deployment.
    # In workshop_draft manifests (source_csv) it is the *target* Gold list to be
    # created once a live layer is provisioned.
    gold_tables:
      - fact_{entity}
      - dim_{entity_1}
      - dim_{entity_2}
    # Populated for workshop runs whose planning_source is Silver/Bronze/source CSV.
    # Downstream workshop deployments use source_assets as the deploy source against
    # silver_schema or bronze_schema.
    source_assets: []   # e.g. [silver_bookings, silver_properties] or [bronze_raw_events]

    # -------------------------------------------------------------------------
    # Metric Views for this domain
    # Source: phase1-addendum-1.3-metric-views.md
    # -------------------------------------------------------------------------
    metric_views:
      - name: "{domain}_analytics_metrics"
        source_table: "fact_{entity}"
        # Optional per-artifact target schema (default: top-level semantic_schema).
        # For workshop deployments on Silver/Bronze, target_schema typically equals
        # ${semantic_schema} or the selected layer's schema; deployment proceeds
        # immediately with a quality advisory. Production hardening promotes the
        # MV onto Gold (manifest-driven re-planning).
        target_schema: "${semantic_schema}"
        description: "Core KPI aggregation for {domain} analytics"
        dimensions:
          - name: "{dimension_1}"
            expr: "{dimension_1}"
            description: "{Dimension description}"
          - name: "{dimension_2}"
            expr: "{dimension_2}"
            description: "{Dimension description}"
        measures:
          - name: "total_{metric}"
            expr: "SUM({metric_column})"
            description: "Total {metric} across all records"
          - name: "{metric}_count"
            expr: "COUNT(*)"
            description: "Number of {entity} records"
        business_questions:
          - "What is the total {metric} by {dimension}?"
          - "How does {metric} trend over time?"
        use_case_refs:              # Links back to plans/use-case-catalog.md
          - "UC-001"                # {Use case name}

    # -------------------------------------------------------------------------
    # Table-Valued Functions for this domain
    # Source: phase1-addendum-1.2-tvfs.md
    # -------------------------------------------------------------------------
    tvfs:
      - name: "get_{domain}_{metric}_summary"
        description: "Returns {metric} aggregated by {dimension} for a date range"
        parameters:
          - name: start_date
            type: STRING
            description: "Start date (YYYY-MM-DD format)"
          - name: end_date
            type: STRING
            description: "End date (YYYY-MM-DD format)"
        # gold_tables_used remains the canonical key for Gold-based runs.
        # source_assets_used is the canonical key for workshop deployments on
        # Silver/Bronze; downstream TVF generation uses whichever is non-empty.
        gold_tables_used:
          - fact_{entity}
          - dim_{entity_1}
        source_assets_used: []   # workshop deployments on Silver/Bronze; e.g. [silver_bookings]
        business_questions:
          - "Show {metric} summary for last 2 weeks"
          - "Daily {metric} breakdown for {date_range}"
        use_case_refs:              # Links back to plans/use-case-catalog.md
          - "UC-001"                # {Use case name}

      - name: "get_top_{domain}_contributors"
        description: "Returns top N contributors by {metric}"
        parameters:
          - name: start_date
            type: STRING
            description: "Start date (YYYY-MM-DD format)"
          - name: end_date
            type: STRING
            description: "End date (YYYY-MM-DD format)"
          - name: top_n
            type: STRING
            description: "Number of top results (default: 10)"
        gold_tables_used:
          - fact_{entity}
          - dim_{entity_1}
        source_assets_used: []   # workshop deployments on Silver/Bronze
        business_questions:
          - "Which {dimension} are the top contributors?"
          - "Top 5 {dimension} by {metric} this month"
        use_case_refs:
          - "UC-001"

    # -------------------------------------------------------------------------
    # Genie Spaces for this domain
    # Source: phase1-addendum-1.6-genie-spaces.md
    # -------------------------------------------------------------------------
    genie_spaces:
      - name: "{Domain} Intelligence"
        description: "Natural language analytics for {domain} domain"
        warehouse: serverless
        assets:
          metric_views:
            - "{domain}_analytics_metrics"
          tvfs:
            - "get_{domain}_{metric}_summary"
            - "get_top_{domain}_contributors"
          tables:
            - "fact_{entity}"
            - "dim_{entity_1}"
            - "dim_{entity_2}"
        benchmark_questions_count: 10
        benchmark_questions:
          - question: "What is the total {metric}?"
            expected_asset: "{domain}_analytics_metrics"
          - question: "Show daily {metric} for last week"
            expected_asset: "get_{domain}_{metric}_summary"

# -----------------------------------------------------------------------------
# Unified Genie Space (cross-domain or workshop mode)
# -----------------------------------------------------------------------------
# Use this key when a single Genie Space spans multiple domains (common in
# workshop mode or when total queryable assets ≤ 15). When present:
#   - The downstream semantic-layer orchestrator checks for `unified_genie_space`
#     FIRST, and if present, SKIPS per-domain `genie_spaces[]` entries.
#   - Per-domain `genie_spaces:` should remain `[]` or be omitted to avoid
#     ambiguous orchestration.
#   - `domains_covered` lists which domains the unified space serves.
#
# Do NOT invent alternative keys (e.g., `unified_genie_spaces` plural,
# `cross_domain_genie`, etc.) — downstream consumers only recognize
# `unified_genie_space` (singular).
# -----------------------------------------------------------------------------
# unified_genie_space:           # Uncomment when using a single cross-domain space
#   name: "{Project} Intelligence"
#   description: "{Combined analytics across all domains}"
#   warehouse: serverless
#   domains_covered:
#     - "{domain_1}"
#     - "{domain_2}"
#   assets:
#     metric_views:
#       - "{domain_1}_analytics_metrics"
#       - "{domain_2}_analytics_metrics"
#     tvfs:
#       - "get_{domain_1}_{metric}_summary"
#       - "get_top_{domain_2}_contributors"
#     tables:
#       - "fact_{entity_1}"
#       - "dim_{entity_1}"
#       - "fact_{entity_2}"
#   total_asset_count: "{N}"            # Must be ≤ 25 (Genie Space hard limit)
#   use_case_refs:
#     - "UC-001"
#     - "UC-002"
#   benchmark_questions_count: "{N}"
#   benchmark_questions:
#     - question: "{Natural language question}"
#       expected_asset: "{asset_name}"

# -----------------------------------------------------------------------------
# Summary counts (for validation)
# Fill in after populating all domains
# -----------------------------------------------------------------------------
summary:
  total_domains: "{N}"
  total_metric_views: "{N}"
  total_tvfs: "{N}"
  total_genie_spaces: "{N}"
  total_benchmark_questions: "{N}"
